# 首次使用：复制为 .env 并设置 POSTGRES_PASSWORD、RYKVO_ADMIN_PASSWORD，然后 docker compose up -d
# 管理员密码在容器首次启动时自动初始化；账号已存在则跳过，改密码需在网页里操作
# 手动初始化（不用环境变量时）：printf '%s' '管理员密码' | docker compose exec -T app rykvo-auth -init
#
# 完整能力部署（与宿主机部署对等）：
#   - network_mode: host   必须。网络控制/SIP/VoWiFi 助手需操纵宿主网络，QMI 数据面接口需可见。
#   - privileged: true     必须。nftables/路由/netns/串口/QMI 节点/热插拔需要特权。
#   - /dev 绑定挂载        新增 ttyUSB* / cdc-wdm* 无需重建容器即可被识别（Quectel 2c7c）。
#   - NGINX_PORT           宿主 80 被占用时改这里（如 7575），宿主反代回源到 127.0.0.1:该端口。
#   - PUBLIC_ORIGIN        经域名反代访问时设置，值为浏览器地址栏 scheme://host[:端口]（不带路径）。
#   - 注意：部分能力（VoWiFi/XFRM、nftables 规则）依赖宿主机内核模块支持。
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rykvo_voice
      POSTGRES_USER: rykvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432" # app 走 host 网络，经宿主回环连接数据库
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rykvo -d rykvo_voice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/my-world-only-me/rykvo-voice:latest
    # 从源码构建时改为： build: .
    container_name: rykvo-voice
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    network_mode: host
    privileged: true
    user: "0:0"

    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgres://rykvo:${POSTGRES_PASSWORD}@127.0.0.1:5432/rykvo_voice?sslmode=disable
      - WEB_ROOT=/opt/rykvo-voice/live/web
      - NGINX_PORT=${NGINX_PORT:-80}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - RYKVO_ADMIN_PASSWORD=${RYKVO_ADMIN_PASSWORD:-}
      # 更安全：改用密钥文件（docker secrets / bind 挂载），文件末尾换行会被自动去除
      # - RYKVO_ADMIN_PASSWORD_FILE=/run/secrets/rykvo-admin-password
      - RYKVO_VISIBILITY_PASSWORD=${RYKVO_VISIBILITY_PASSWORD:-}
      # - RYKVO_VISIBILITY_PASSWORD_FILE=/run/secrets/rykvo-visibility-password
      - RYKVO_WIFI_ENGINE=vocat
      - CONTROL_SOCKET=/run/rykvo-voice/control.sock
      - TUNNEL_DIR=/var/lib/rykvo-voice/tunnel
      - TUNNEL_BIN=/opt/rykvo-voice/live/cloudflared

    volumes:
      - ./data:/var/lib/rykvo-voice
      - /dev:/dev
      - /sys:/sys:ro

    mem_limit: 768m
    memswap_limit: 896m
    stop_grace_period: 30s

    healthcheck:
      test: "wget -q -O /dev/null http://127.0.0.1:$${NGINX_PORT}/ || exit 1"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

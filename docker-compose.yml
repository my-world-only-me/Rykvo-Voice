# 首次使用：复制为 .env 并修改 POSTGRES_PASSWORD，然后 docker compose up -d
# 初始化管理员：printf '%s\n' '管理员密码' | docker compose exec -T app rykvo-auth -init
#
# EC20 模组直通（与 VoCat 栈同款方案）：
#   - network_mode: host  必须。QMI 数据面接口与 SIP/RTP 需对容器可见（后端 SIP 网关也随宿主网络监听）。
#   - privileged: true    必须。串口 / QMI 控制节点 / 网络配置 / 设备热插拔需要特权。
#   - /dev 绑定挂载       新增 ttyUSB* / cdc-wdm* 无需重建容器即可被识别（Quectel 2c7c）。
#   - user: "0:0"         root 才能访问上述硬件节点。
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rykvo_voice
      POSTGRES_USER: rykvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432" # app 走 host 网络，经宿主回环连接数据库
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rykvo -d rykvo_voice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/my-world-only-me/rykvo-voice:latest
    # 从源码构建时改为： build: .
    container_name: rykvo-voice
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    network_mode: host
    privileged: true
    user: "0:0"

    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgres://rykvo:${POSTGRES_PASSWORD}@127.0.0.1:5432/rykvo_voice?sslmode=disable
      - WEB_ROOT=/app/web

    volumes:
      - ./data:/var/lib/rykvo-voice
      - /dev:/dev
      - /sys:/sys:ro

    mem_limit: 512m
    memswap_limit: 640m
    stop_grace_period: 20s

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

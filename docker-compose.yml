# 首次使用：复制为 .env 并修改 POSTGRES_PASSWORD，然后 docker compose up -d
# 初始化管理员：printf '%s\n' '管理员密码' | docker compose exec -T app rykvo-auth -init
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rykvo_voice
      POSTGRES_USER: rykvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rykvo -d rykvo_voice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/my-world-only-me/rykvo-voice:latest
    # 从源码构建时改为： build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rykvo:${POSTGRES_PASSWORD}@db:5432/rykvo_voice?sslmode=disable
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - app-data:/var/lib/rykvo-voice

volumes:
  db-data:
  app-data:
